  <text x="262" y="168" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#f5efe6" fill-opacity="0.85">Split shared expenses fairly — with debt simplification.</text>
